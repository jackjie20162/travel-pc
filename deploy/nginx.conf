# travel-pc 生产 nginx 配置（k8s 集群内静态文件 + API 反向代理）
# 前端请求层（src/api.js）统一走相对路径，与 vite dev proxy 对齐：
#   /api     -> travel-api:9206
#   /uploads -> merchant-upload-api:9208（本地存储模式的媒体文件）
#   /ws、/im -> im-gateway:9281（IM 同源接入，无需独立域名）
# 服务名使用集群内短 DNS（要求与后端同处 namespace simple-admin），
# 跨 namespace 请改为 <svc>.simple-admin.svc.cluster.local

server {
    listen       80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    client_max_body_size 512m;

    # kube-dns 动态解析：后端 Service 尚未创建时前端 Pod 也能正常启动
    resolver kube-dns.kube-system.svc.cluster.local valid=10s ipv6=off;

    set $travel_api      "http://travel-api:9206";
    set $merchant_upload "http://merchant-upload-api:9208";
    set $im_gateway      "http://im-gateway:9281";

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # ---- API 反向代理 ----
    location /api {
        proxy_pass $travel_api;
    }

    # 本地存储媒体文件回显
    location /uploads {
        proxy_pass $merchant_upload;
    }

    # ---- IM 网关同源接入（im-gateway:9281）----
    # WebSocket 长连接：/ws?user_type=3&biz_uid=xxx
    location /ws {
        proxy_pass $im_gateway;
        proxy_http_version 1.1;
        # location 内重新声明会覆盖 server 级 proxy_set_header，需重复公共头
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
    }

    # IM HTTP 接口：/im/upload、/im/send-msg、/im/uploads/* 图片回显
    location /im {
        proxy_pass $im_gateway;
    }

    # ---- SPA history 路由回退 ----
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源缓存（vite 产物带 hash）
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
